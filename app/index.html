<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3A584B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="صمام">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
<title>صمام | لوحة التحكم</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --g:#3A584B; --g2:#4a6d5c; --gold:#BCA569; --gold2:#cdbb8a;
    --w:#FFFFFF; --off:#F7F6F2; --t:#1c2621; --t2:#4a534d; --t3:#7c847e; --bd:#e4e2da;
    --warn-bg:#fdf3e3; --warn-t:#8a5a00; --ok-bg:#eaf5ee; --ok-t:#1e6b3a; --err-bg:#fdecec; --err-t:#b3261e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{font-family:'Tajawal',sans-serif;background:var(--off);color:var(--t)}
  .shell{display:flex;min-height:100vh}

  .sidebar{width:230px;background:var(--g);flex-shrink:0;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .sb-brand{display:flex;align-items:center;gap:.6rem;padding:1.2rem 1.1rem;border-bottom:1px solid rgba(255,255,255,.1)}
  .sb-brand img{width:32px;height:auto}
  .sb-brand .n{color:#fff;font-size:.9rem;font-weight:700}
  .sb-brand .r{color:var(--gold2);font-size:.65rem}
  .sb-nav{flex:1;padding:1rem .7rem;overflow-y:auto}
  .sb-item{display:block;padding:.7rem .9rem;border-radius:8px;color:rgba(255,255,255,.75);font-size:.85rem;font-weight:500;cursor:pointer;margin-bottom:.2rem;transition:all .15s;user-select:none}
  .sb-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .sb-item.active{background:rgba(255,255,255,.14);color:#fff;font-weight:700;border-right:3px solid var(--gold)}
  .sb-sect{font-size:.65rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.06em;padding:1rem .9rem .3rem;font-weight:700}
  .sb-foot{padding:1rem;border-top:1px solid rgba(255,255,255,.1)}
  .sb-who{color:rgba(255,255,255,.85);font-size:.78rem;margin-bottom:.6rem}
  .logout{width:100%;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.18);padding:.55rem;border-radius:8px;font-family:inherit;font-size:.78rem;cursor:pointer}
  .logout:hover{background:rgba(255,255,255,.18)}

  .topbar{display:none;background:var(--g);padding:.8rem 1rem;align-items:center;justify-content:space-between}
  .hamburger{color:#fff;font-size:1.3rem;background:none;border:none;cursor:pointer}
  .bottom-nav{display:none}
  @media(max-width:860px){
    .sidebar{position:fixed;right:-240px;top:0;z-index:50;transition:right .25s;box-shadow:0 0 30px rgba(0,0,0,.3)}
    .sidebar.open{right:0}
    .topbar{display:flex}
    .main{width:100%}
    .wrap{padding-bottom:5.5rem}
    .bottom-nav{display:flex;position:fixed;bottom:0;right:0;left:0;background:#fff;border-top:1px solid var(--bd);z-index:40;padding-bottom:env(safe-area-inset-bottom)}
    .bn-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:.2rem;padding:.6rem 0 .5rem;background:none;border:none;font-family:inherit;color:var(--t3);font-size:.65rem;cursor:pointer;position:relative}
    .bn-item.active{color:var(--g);font-weight:700}
    .bn-ico{font-size:1.25rem}
    .bn-dot{position:absolute;top:2px;left:calc(50% + 6px);width:8px;height:8px;border-radius:50%;background:#e05a4e}
  }

  .main{flex:1;min-width:0}
  .main-top{background:#fff;border-bottom:1px solid var(--bd);padding:.9rem 1.8rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  .page-title{font-size:1.05rem;font-weight:800}
  .bell{position:relative;cursor:pointer;background:var(--off);border:1px solid var(--bd);border-radius:8px;padding:.5rem .7rem;font-size:.9rem}
  .bell .dot{position:absolute;top:-4px;left:-4px;background:#e05a4e;color:#fff;font-size:.62rem;font-weight:700;border-radius:100px;padding:.05rem .35rem;min-width:16px;text-align:center}
  .notif-panel{position:absolute;top:calc(100% + 8px);left:0;background:#fff;border:1px solid var(--bd);border-radius:12px;width:320px;max-height:400px;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.15);display:none;z-index:30}
  .notif-panel.open{display:block}
  .notif-item{padding:.8rem 1rem;border-bottom:1px solid var(--bd);font-size:.8rem;cursor:pointer}
  .notif-item:last-child{border-bottom:none}
  .notif-item.unread{background:var(--off);font-weight:700}
  .notif-item .time{font-size:.68rem;color:var(--t3);margin-top:.25rem;font-weight:400}

  .wrap{max-width:960px;margin:0 auto;padding:1.5rem 1.8rem}
  .section-title{font-size:1rem;font-weight:800;margin:1.6rem 0 .8rem;display:flex;align-items:center;gap:.5rem}
  .section-title:first-child{margin-top:0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem;margin-bottom:1.5rem}
  .stat{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:1rem;text-align:center;transition:all .2s}
  .stat .n{font-size:1.5rem;font-weight:800;color:var(--g)}
  .stat .l{font-size:.72rem;color:var(--t3);margin-top:.2rem}
  .stat.highlight{background:var(--warn-bg);border-color:#f0d9a8}
  .stat.highlight .n{color:var(--warn-t)}
  .stat.highlight .l{color:var(--warn-t)}

  .card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:1.2rem;margin-bottom:.9rem}
  .card.urgent{border-right:4px solid #d9534f}
  .req-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem}
  .req-title{font-size:.9rem;font-weight:700}
  .req-meta{font-size:.75rem;color:var(--t3);margin-top:.2rem}
  .company-chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.7rem;font-weight:700;color:var(--g);background:var(--off);border:1px solid var(--bd);padding:.2rem .6rem;border-radius:100px;margin-top:.3rem}
  .urgent-chip{display:inline-flex;align-items:center;gap:.3rem;font-size:.68rem;font-weight:700;color:#d9534f;background:#fdecec;padding:.2rem .6rem;border-radius:100px}
  .badge{font-size:.72rem;font-weight:700;padding:.3rem .7rem;border-radius:100px;white-space:nowrap}
  .b-new{background:#eef1f4;color:#445}
  .b-progress{background:var(--warn-bg);color:var(--warn-t)}
  .b-review{background:#eef1f4;color:#445}
  .b-approval{background:var(--warn-bg);color:var(--warn-t)}
  .b-revision{background:var(--err-bg);color:var(--err-t)}
  .b-done{background:var(--ok-bg);color:var(--ok-t)}
  .b-pending{background:var(--warn-bg);color:var(--warn-t)}
  .b-active{background:var(--ok-bg);color:var(--ok-t)}
  .live-pill{display:inline-flex;align-items:center;gap:.4rem;background:var(--ok-bg);color:var(--ok-t);font-size:.72rem;font-weight:700;padding:.3rem .7rem;border-radius:100px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--ok-t);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

  .progress-bar{display:flex;align-items:flex-start;margin:.9rem 0}
  .progress-step{flex:1;text-align:center;position:relative}
  .progress-line{position:absolute;top:11px;right:50%;width:100%;height:2px;background:var(--bd);z-index:0}
  .progress-step:first-child .progress-line{display:none}
  .progress-step.done .progress-line{background:var(--g)}
  .dot{width:22px;height:22px;border-radius:50%;background:var(--bd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:700;margin:0 auto .4rem;position:relative;z-index:1}
  .progress-step.done .dot{background:var(--g)}
  .progress-step.current .dot{background:var(--gold);color:var(--t)}
  .progress-step .lbl{font-size:.62rem;color:var(--t3)}
  .progress-step.done .lbl,.progress-step.current .lbl{color:var(--t);font-weight:700}

  .btn{display:inline-block;padding:.55rem 1rem;border:none;border-radius:8px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;text-decoration:none}
  .btn-g{background:var(--g);color:#fff}
  .btn-g:hover{background:var(--g2)}
  .btn-o{background:transparent;border:1px solid var(--bd);color:var(--t2)}
  .btn-o:hover{background:var(--off)}
  .btn-danger{background:var(--err-bg);color:var(--err-t);border:1px solid #f3c9c6}
  .btn-sm{padding:.4rem .8rem;font-size:.75rem}

  .alert-banner{background:var(--warn-bg);border:1px solid #f0d9a8;color:var(--warn-t);border-radius:10px;padding:.9rem 1.1rem;margin-bottom:1.2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem;font-size:.85rem;font-weight:700}

  .dropzone{border:2px dashed var(--bd);border-radius:10px;padding:1rem;transition:all .2s}
  .dropzone.dragover{border-color:var(--gold);background:rgba(188,165,105,.08)}
  .upload-row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
  .file-label{display:inline-flex;align-items:center;gap:.4rem;background:var(--off);border:1px solid var(--bd);border-radius:8px;padding:.5rem .8rem;font-size:.78rem;cursor:pointer;color:var(--t2)}
  .file-label:hover{background:#eee}
  .file-label input{display:none}

  form.new-req{display:grid;gap:.8rem}
  label{font-size:.78rem;font-weight:700;color:var(--t2);display:block;margin-bottom:.3rem}
  input,textarea,select{width:100%;padding:.65rem .8rem;border:1px solid var(--bd);border-radius:8px;font-family:inherit;font-size:16px;background:var(--off)}
  textarea{resize:vertical;min-height:70px}
  .draft-item{border-top:1px solid var(--bd);padding-top:.7rem;margin-top:.7rem}
  .attach-link{display:block;font-size:.78rem;color:var(--g);margin-top:.3rem;text-decoration:none}
  .attach-link:hover{text-decoration:underline}

  .empty-state{text-align:center;padding:2.5rem 1rem;color:var(--t3)}
  .empty-state .ico{font-size:2rem;margin-bottom:.6rem}
  .empty-state .msg1{font-size:.85rem;font-weight:700;color:var(--t2);margin-bottom:.3rem}
  .empty-state .msg2{font-size:.78rem}

  .loading{text-align:center;padding:3rem;color:var(--t3)}
  .msg{font-size:.82rem;padding:.7rem .9rem;border-radius:8px;margin-bottom:1rem}
  .msg.err{background:var(--err-bg);color:var(--err-t)}
  .msg.ok{background:var(--ok-bg);color:var(--ok-t)}
  table.report{width:100%;border-collapse:collapse;font-size:.82rem}
  table.report th{text-align:right;color:var(--t3);font-weight:700;font-size:.72rem;padding:.5rem;border-bottom:1px solid var(--bd)}
  table.report td{padding:.6rem .5rem;border-bottom:1px solid var(--bd)}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="sb-brand"><img src="/assets/logo.png" alt="صمام"><div><div class="n">صمام</div><div class="r">من إتقان</div></div></div>
    <nav class="sb-nav" id="sbNav"></nav>
    <div class="sb-foot">
      <div class="sb-who" id="whoami">...</div>
      <button class="logout" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <img src="/assets/logo.png" alt="صمام" style="width:28px">
    </div>
    <div class="main-top">
      <div class="page-title" id="pageTitle">لوحة التحكم</div>
      <div style="display:flex;align-items:center;gap:.6rem;position:relative">
        <div id="companySearchWrap" style="display:none;position:relative">
          <input id="companySearchInput" placeholder="🔍 ابحث عن شركة..." style="width:220px;font-size:.8rem">
          <div id="companySearchResults" class="notif-panel" style="width:260px"></div>
        </div>
        <div class="bell" id="bellBtn">🔔<span class="dot" id="bellCount" style="display:none">0</span>
          <div class="notif-panel" id="notifPanel"></div>
        </div>
      </div>
    </div>
    <div class="wrap" id="app"><div class="loading">جاري التحميل...</div></div>
  </div>
  <nav class="bottom-nav" id="bottomNav"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://rvdhaylilyfclxbkpwud.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2ZGhheWxpbHlmY2x4Ymtwd3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTk0MDEsImV4cCI6MjEwNDc5NTQwMX0.adDwLJNuYyOVd-z-qJaThwl0D0_7Sb0wsPvt8MhEU94";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_LABELS = {
  new: ['جديد', 'b-new'], assigned: ['مُسند', 'b-new'], in_progress: ['قيد التنفيذ', 'b-progress'],
  pending_admin_review: ['بانتظار مراجعة المدير', 'b-review'], pending_client_approval: ['بانتظار اعتمادك', 'b-approval'],
  client_revision_requested: ['طلب تعديل', 'b-revision'], awaiting_final_file: ['بانتظار الملف النهائي', 'b-approval'],
  completed: ['مكتمل', 'b-done'],
};
const PROGRESS_LABELS = ['تم الاستلام', 'قيد التنفيذ', 'بانتظار الاعتماد', 'مكتمل'];
const QUICK_TITLES = {
  hr: ['تحديث عقد عمل', 'إصدار تأشيرة عمل', 'إعداد مسير رواتب', 'تجديد إقامة موظف', 'إنهاء خدمات موظف'],
  accounting: ['مراجعة فواتير الشهر', 'إعداد قوائم مالية', 'تسوية زكوية وضريبية', 'مطابقة بنكية', 'إقفال شهري'],
  marketing: ['إطلاق حملة إعلانية', 'تصميم منشورات الشهر', 'تقرير أداء الحسابات', 'خطة محتوى جديدة'],
  consulting: ['استشارة تطوير أعمال', 'إعادة هيكلة تنظيمية', 'دراسة جدوى'],
  investment: ['استفسار عن رخصة استثمار', 'متابعة طلب تسجيل استثماري'],
};

const app = document.getElementById('app');
let CURRENT_USER = null, CURRENT_PROFILE = null, CURRENT_COMPANY = null, ALL_SERVICES = [];
let currentView = 'dashboard';
let rerenderTimeout = null;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/'; return; }
  CURRENT_USER = session.user;

  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', CURRENT_USER.id).single();
  if (error || !profile) { app.innerHTML = `<div class="msg err">تعذر تحميل بيانات حسابك. تواصل مع الإدارة.</div>`; return; }
  CURRENT_PROFILE = profile;

  await ensureCompanyLinked();

  const { data: services } = await sb.from('services').select('*').eq('is_active', true);
  ALL_SERVICES = services || [];

  document.getElementById('whoami').textContent = `${profile.full_name} · ${roleLabel(profile.role)}`;
  renderSidebar();
  loadNotifications();
  setupRealtime();
  setupChrome();
}

async function ensureCompanyLinked() {
  if (CURRENT_PROFILE.role !== 'client' || CURRENT_PROFILE.company_id) return;
  const key = 'samam_pending_company_' + CURRENT_USER.id;
  const raw = localStorage.getItem(key);
  if (!raw) return;
  try {
    const info = JSON.parse(raw);
    const newId = crypto.randomUUID();
    const { error } = await sb.from('companies').insert({ id: newId, ...info });
    if (!error) {
      await sb.from('profiles').update({ company_id: newId }).eq('id', CURRENT_USER.id);
      CURRENT_PROFILE.company_id = newId;
      localStorage.removeItem(key);
    }
  } catch (e) {}
}

function roleLabel(r) { return { client: 'عميل', staff: 'فريق العمل', admin: 'إدارة' }[r] || r; }
function statusBadge(s) {
  const [label, cls] = STATUS_LABELS[s] || [s, 'b-new'];
  const displayLabel = (s === 'pending_client_approval' && CURRENT_PROFILE?.role !== 'client') ? 'بانتظار اعتماد العميل' : label;
  return `<span class="badge ${cls}">${displayLabel}</span>`;
}
function fmtDate(d) { return new Date(d).toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' }); }
function fmtDateTime(d) { return new Date(d).toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function fmtDuration(sec) { if (!sec) return '—'; const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60); return h>0 ? `${h}س ${m}د` : `${m}د`; }
function timeAgo(d) {
  const diff = (Date.now() - new Date(d).getTime())/1000;
  if (diff < 60) return 'الآن';
  if (diff < 3600) return `منذ ${Math.floor(diff/60)} د`;
  if (diff < 86400) return `منذ ${Math.floor(diff/3600)} س`;
  return fmtDate(d);
}
function companyChip(c) { return c ? `<span class="company-chip">🏢 ${c.name}${c.cr_number ? ' · '+c.cr_number : ''}</span>` : ''; }
function priorityCardClass(p) { return p === 'urgent' ? 'urgent' : ''; }
function urgentChip(p) { return p === 'urgent' ? `<span class="urgent-chip">🔴 عاجل</span>` : ''; }
function emptyState(icon, msg1, msg2) { return `<div class="empty-state"><div class="ico">${icon}</div><div class="msg1">${msg1}</div><div class="msg2">${msg2||''}</div></div>`; }

// Shared helper: run a Supabase call, alert the user clearly if it fails
// (RLS violations, network errors, etc. no longer fail silently).
async function runOrAlert(promise, failLabel) {
  const { error } = await promise;
  if (error) { alert(`${failLabel}: ${error.message}`); return false; }
  return true;
}

function progressStep(status) {
  if (status === 'completed') return 3;
  if (status === 'pending_client_approval' || status === 'client_revision_requested' || status === 'awaiting_final_file') return 2;
  if (status === 'in_progress' || status === 'pending_admin_review') return 1;
  return 0;
}
function progressBarHtml(status) {
  const cur = progressStep(status);
  return `<div class="progress-bar">${PROGRESS_LABELS.map((lbl,i) => `
    <div class="progress-step ${i<cur?'done':''} ${i===cur?'current':''}">
      <div class="progress-line"></div>
      <div class="dot">${i<cur?'✓':i+1}</div>
      <div class="lbl">${lbl}</div>
    </div>`).join('')}</div>`;
}

function setupChrome() {
  document.getElementById('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); window.location.href = '/'; });
  document.getElementById('hamburger').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));
  const bellBtn = document.getElementById('bellBtn'), panel = document.getElementById('notifPanel');
  bellBtn.addEventListener('click', () => panel.classList.toggle('open'));
  document.addEventListener('click', (e) => {
    if (!bellBtn.contains(e.target)) panel.classList.remove('open');
    const searchWrap = document.getElementById('companySearchWrap');
    if (searchWrap && !searchWrap.contains(e.target)) document.getElementById('companySearchResults').classList.remove('open');
  });

  if (CURRENT_PROFILE.role === 'admin') {
    document.getElementById('companySearchWrap').style.display = 'block';
    const input = document.getElementById('companySearchInput');
    const resultsEl = document.getElementById('companySearchResults');
    let searchTimeout = null;
    input.addEventListener('input', () => {
      clearTimeout(searchTimeout);
      const q = input.value.trim();
      if (!q) { resultsEl.classList.remove('open'); return; }
      searchTimeout = setTimeout(async () => {
        const { data: companies } = await sb.from('companies').select('*').or(`name.ilike.%${q}%,cr_number.ilike.%${q}%`).limit(10);
        resultsEl.innerHTML = (companies && companies.length)
          ? companies.map(c => `<div class="notif-item" data-company="${c.id}">🏢 ${c.name}<div class="time">${c.cr_number||''}</div></div>`).join('')
          : `<div class="notif-item">لا توجد نتائج</div>`;
        resultsEl.classList.add('open');
        resultsEl.querySelectorAll('[data-company]').forEach(el => el.addEventListener('click', () => {
          navigate('company:' + el.dataset.company, 'ملف الشركة');
          resultsEl.classList.remove('open');
          input.value = '';
        }));
      }, 300);
    });
  }
}

function navigate(view, label) {
  currentView = view;
  document.getElementById('pageTitle').textContent = label;
  document.querySelectorAll('.sb-item').forEach(el => el.classList.toggle('active', el.dataset.view === view));
  document.querySelectorAll('.bn-item').forEach(el => el.classList.toggle('active', el.dataset.bn === view));
  document.getElementById('sidebar').classList.remove('open');
  renderContent();
}

function renderSidebar() {
  const nav = document.getElementById('sbNav');
  let html = `<div class="sb-item" data-view="dashboard">لوحة التحكم</div>`;
  if (CURRENT_PROFILE.role === 'client') {

async function loadNotifications() {
  const { data: notifs } = await sb.from('notifications').select('*').eq('recipient_id', CURRENT_USER.id).order('created_at', { ascending: false }).limit(20);
  const panel = document.getElementById('notifPanel'), countEl = document.getElementById('bellCount');
  const unread = (notifs || []).filter(n => !n.is_read).length;
  countEl.style.display = unread > 0 ? 'block' : 'none';
  countEl.textContent = unread;
  const bnDot = document.getElementById('bnBellDot');
  if (bnDot) bnDot.style.display = unread > 0 ? 'block' : 'none';
  panel.innerHTML = (notifs && notifs.length)
    ? notifs.map(n => `<div class="notif-item ${!n.is_read?'unread':''}" data-notif="${n.id}">${n.message}<div class="time">${timeAgo(n.created_at)}</div></div>`).join('')
    : `<div class="notif-item">لا توجد إشعارات بعد.</div>`;
  panel.querySelectorAll('[data-notif]').forEach(el => el.addEventListener('click', async () => {
    await sb.from('notifications').update({ is_read: true }).eq('id', el.dataset.notif);
    loadNotifications();
  }));
}

function setupRealtime() {
  const debounced = () => { clearTimeout(rerenderTimeout); rerenderTimeout = setTimeout(rerenderCurrentRole, 400); };
  sb.channel('samam-live-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'requests' }, debounced)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'drafts' }, debounced)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'task_timer_logs' }, debounced)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'request_attachments' }, debounced)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'companies' }, debounced)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notifications' }, loadNotifications)
    .subscribe();
}

function uploadWidgetHtml(idPrefix) {
  return `
    <div class="dropzone" id="${idPrefix}-dropzone">

        <label class="file-label">📎 إرفاق ملف<input type="file" multiple id="${idPrefix}-files"></label>

      </div>

    </div>
  `;
}
function wireUploadWidgetPreview(idPrefix) {
  const namesEl = document.getElementById(`${idPrefix}-filenames`);
  const update = () => {
    const f1 = [...(document.getElementById(`${idPrefix}-files`)?.files || [])];
    const f2 = [...(document.getElementById(`${idPrefix}-camera`)?.files || [])];
    const names = [...f1, ...f2].map(f => f.name);
    namesEl.textContent = names.length ? `تم اختيار: ${names.join('، ')}` : '';
  };
  document.getElementById(`${idPrefix}-files`)?.addEventListener('change', update);
  document.getElementById(`${idPrefix}-camera`)?.addEventListener('change', update);
  wireDragDrop(`${idPrefix}-dropzone`, `${idPrefix}-files`, update);
}
function wireDragDrop(zoneId, fileInputId, onUpdate) {
  const zone = document.getElementById(zoneId);
  const input = document.getElementById(fileInputId);
  if (!zone || !input) return;
  ['dragover','dragenter'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('dragover'); }));
  ['dragleave','drop'].forEach(ev => zone.addEventListener(ev, e => { e.preventDefault(); zone.classList.remove('dragover'); }));
  zone.addEventListener('drop', e => {
    const dt = new DataTransfer();
    [...input.files].forEach(f => dt.items.add(f));
    [...e.dataTransfer.files].forEach(f => dt.items.add(f));
    input.files = dt.files;
    if (onUpdate) onUpdate();
  });
}
function collectUploadFiles(idPrefix) {
  const f1 = [...(document.getElementById(`${idPrefix}-files`)?.files || [])];
  const f2 = [...(document.getElementById(`${idPrefix}-camera`)?.files || [])];
  return [...f1, ...f2];
}

      }
    }
    msgEl.innerHTML = `<div class="msg ok">تم إرسال طلبك بنجاح.</div>`;
    e.target.reset();
    renderClientServicePage(serviceId);
  });

  const listEl = document.getElementById('reqList');
  if (!requests || requests.length === 0) { listEl.innerHTML = emptyState('📄', 'لا توجد طلبات بهذه الخدمة بعد', 'أرسل طلبك الأول باستخدام النموذج أعلاه'); return; }

  for (const r of requests) {
    const { data: drafts } = await sb.from('drafts').select('*').eq('request_id', r.id).order('version', { ascending: false });
    const visibleDraft = (drafts || [])[0];
    const { data: openTimer } = await sb.from('task_timer_logs').select('*').eq('request_id', r.id).is('ended_at', null).maybeSingle();
    const attachHtml = await attachmentsHtml(r.id);
    const finalHtml = await finalFileHtml(r);
    const inqHtml = await inquiriesHtml(r.id, 'client');
    const draftLinkHtml = visibleDraft ? await draftFileLinkHtml(visibleDraft) : '';
    const versionHtml = await versionHistoryHtml(r.id);

    const card = document.createElement('div');
    card.className = `card ${priorityCardClass(r.priority)}`;
    card.innerHTML = `
      <div class="req-row">
        <div><div class="req-title">${r.title} ${urgentChip(r.priority)}</div><div class="req-meta">${fmtDate(r.created_at)}</div></div>
        <div style="display:flex;gap:.5rem;align-items:center">${openTimer ? `<span class="live-pill"><span class="live-dot"></span>الموظف يعمل الآن</span>` : ''}${statusBadge(r.status)}</div>
      </div>
      ${progressBarHtml(r.status)}
      ${timestampsHtml(r)}
      ${attachHtml}
      ${inqHtml}
      ${finalHtml}
      ${visibleDraft ? `
        <div class="draft-item">
          <div class="req-meta" style="margin-bottom:.5rem">مسودة النسخة ${visibleDraft.version} — ${statusBadge(visibleDraft.status)}</div>
          <div style="margin-bottom:.5rem">${draftLinkHtml}</div>
          ${visibleDraft.status === 'approved_for_client' ? `
            <div style="display:flex;gap:.5rem">
              <button class="btn btn-g btn-sm" data-approve="${visibleDraft.id}" data-req="${r.id}">اعتماد ←</button>
              <button class="btn btn-o btn-sm" data-revise="${visibleDraft.id}">طلب تعديل</button>
            </div>
            <div id="rev-form-${visibleDraft.id}" style="display:none;margin-top:.6rem">
              <textarea id="rev-notes-${visibleDraft.id}" placeholder="اكتب ملاحظاتك..."></textarea>
              <button class="btn btn-g btn-sm" style="margin-top:.5rem" data-send-revision="${visibleDraft.id}" data-req="${r.id}">إرسال الملاحظات ←</button>
            </div>` : ''}
        </div>` : ''}
      ${versionHtml}
    `;
    listEl.appendChild(card);
    wireInquiryAnswerButtons(card, () => renderClientServicePage(serviceId));
  }
  listEl.querySelectorAll('[data-approve]').forEach(btn => btn.addEventListener('click', async () => {
    const { error } = await sb.from('drafts').update({ status: 'approved_by_client' }).eq('id', btn.dataset.approve);
    if (error) { alert('تعذر الاعتماد: ' + error.message); return; }
    renderClientServicePage(serviceId);
  }));
  listEl.querySelectorAll('[data-revise]').forEach(btn => btn.addEventListener('click', () => { document.getElementById(`rev-form-${btn.dataset.revise}`).style.display = 'block'; }));
  listEl.querySelectorAll('[data-send-revision]').forEach(btn => btn.addEventListener('click', async () => {
    const notes = document.getElementById(`rev-notes-${btn.dataset.sendRevision}`).value.trim();
    const { error } = await sb.from('drafts').update({ status: 'client_revision_requested', client_notes: notes }).eq('id', btn.dataset.sendRevision);
    if (error) { alert('تعذر إرسال طلب التعديل: ' + error.message); return; }
    renderClientServicePage(serviceId);
  }));
}

          <div><label>رقم السجل التجاري الموحد</label><input id="ccf-cr" required placeholder="٧٠٠٠xxxxxx"></div>

            <select id="ccf-entity" required>

              ${['مؤسسة فردية','شركة ذات مسؤولية محدودة','شركة الشخص الواحد','شركة مساهمة مبسطة','شركة تضامن','فرع شركة أجنبية','أخرى']
                .map(o => `<option>${o}</option>`).join('')}
            </select>
          </div>
          <button type="submit" class="btn btn-g">حفظ بيانات المنشأة ←</button>
        </form>
        <div id="ccf-msg"></div>
      `}
    </div>
  `;

  document.getElementById('profileForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const full_name = document.getElementById('pf-name').value.trim();
    const phone = document.getElementById('pf-phone').value.trim();
    const { error } = await sb.from('profiles').update({ full_name, phone }).eq('id', CURRENT_USER.id);
    const msgEl = document.getElementById('pf-msg');
    msgEl.innerHTML = error ? `<div class="msg err">تعذر الحفظ: ${error.message}</div>` : `<div class="msg ok">تم الحفظ بنجاح.</div>`;
    if (!error) { CURRENT_PROFILE.full_name = full_name; document.getElementById('whoami').textContent = `${full_name} · ${roleLabel(CURRENT_PROFILE.role)}`; }
  });

  document.getElementById('companyForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('cf-name').value.trim();
    const cr_number = document.getElementById('cf-cr').value.trim();
    const entity_type = document.getElementById('cf-entity').value;
    const { error } = await sb.from('companies').update({ name, cr_number, entity_type }).eq('id', company.id);
    document.getElementById('cf-msg').innerHTML = error ? `<div class="msg err">تعذر الحفظ: ${error.message}</div>` : `<div class="msg ok">تم تحديث بيانات المنشأة بنجاح.</div>`;

  document.getElementById('companyCreateForm')?.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true; btn.textContent = 'جاري الحفظ...';
    const name = document.getElementById('ccf-name').value.trim();
    const cr_number = document.getElementById('ccf-cr').value.trim();
    const entity_type = document.getElementById('ccf-entity').value;
    const msgEl = document.getElementById('ccf-msg');

    const newId = crypto.randomUUID();
    const { error } = await sb.from('companies').insert({ id: newId, name, cr_number, entity_type });
    if (error) { msgEl.innerHTML = `<div class="msg err">تعذر الحفظ: ${error.message}</div>`; btn.disabled = false; btn.textContent = 'حفظ بيانات المنشأة ←'; return; }

    const { error: linkErr } = await sb.from('profiles').update({ company_id: newId }).eq('id', CURRENT_USER.id);
    if (linkErr) { msgEl.innerHTML = `<div class="msg err">تعذر الربط: ${linkErr.message}</div>`; btn.disabled = false; btn.textContent = 'حفظ بيانات المنشأة ←'; return; }

    CURRENT_PROFILE.company_id = newId;
    msgEl.innerHTML = `<div class="msg ok">تم حفظ بيانات منشأتك. بانتظار تفعيل الإدارة قبل إرسال الطلبات.</div>`;
    renderClientProfile();
  });
}

// =====================================================================
// CLIENT: DOCUMENTS (all attachments across all requests)
// =====================================================================
async function renderClientDocuments() {
  const { data: requests } = await sb.from('requests').select('id, title, services(name_ar)').eq('client_id', CURRENT_USER.id);
  app.innerHTML = `<div class="section-title">كل مستنداتي</div><div id="docsList"></div>`;
  const el = document.getElementById('docsList');
  if (!requests || requests.length === 0) { el.innerHTML = emptyState('📁', 'لا توجد مستندات بعد', ''); return; }

  let any = false;
  for (const r of requests) {
    const { data: atts } = await sb.from('request_attachments').select('*').eq('request_id', r.id);
    if (!atts || atts.length === 0) continue;
    any = true;
    const links = await Promise.all(atts.map(async a => {
      const { data } = await sb.storage.from('client-uploads').createSignedUrl(a.file_path, 3600);
      return `<a class="attach-link" href="${data?.signedUrl || '#'}" target="_blank">📎 ${a.file_name}</a>`;
    }));
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="req-title">${r.title}</div><div class="req-meta">${r.services?.name_ar||''}</div>${links.join('')}`;
    el.appendChild(card);
  }
  if (!any) el.innerHTML = emptyState('📁', 'لا توجد مستندات بعد', 'المستندات التي ترفقها مع طلباتك تظهر هنا');
}

async function renderStaffTasks() {
  const { data: requests } = await sb.from('requests').select('*, services(name_ar), companies(id, name, cr_number)').eq('assigned_staff_id', CURRENT_USER.id).order('created_at', { ascending: false });
  if (!requests || requests.length === 0) {
    app.innerHTML = `<div id="taskList"></div>`;
    document.getElementById('taskList').innerHTML = emptyState('☕', 'لا توجد مهام مسندة إليك حالياً', 'استرح قليلاً، سيصلك إشعار فور إسناد مهمة جديدة');
    return;
  }

  // group by company so a staff member handling several clients can scan by company
  const companiesInvolved = [...new Map(requests.filter(r => r.companies).map(r => [r.companies.id, r.companies])).values()];

  app.innerHTML = `
    ${companiesInvolved.length > 1 ? `
      <div class="card">
        <label>تصفية حسب الشركة</label>
        <select id="staffCompanyFilter">
          <option value="">كل الشركات (${requests.length} مهمة)</option>
          ${companiesInvolved.map(c => `<option value="${c.id}">🏢 ${c.name}</option>`).join('')}
        </select>
      </div>` : ''}
    <div id="taskList"></div>
  `;

  document.getElementById('staffCompanyFilter')?.addEventListener('change', (e) => renderTaskCards(e.target.value));
  renderTaskCards('');

  function renderTaskCards(filterCompanyId) {
    const listEl = document.getElementById('taskList');
    listEl.innerHTML = '';
    const filtered = filterCompanyId ? requests.filter(r => r.companies?.id === filterCompanyId) : requests;

    // sort so tasks are visually grouped by company, "no company" last
    const sorted = [...filtered].sort((a, b) => (a.companies?.name || 'ز').localeCompare(b.companies?.name || 'ز', 'ar'));

    let lastCompanyId = undefined;
    sorted.forEach(r => {
      if (!filterCompanyId && companiesInvolved.length > 1 && r.companies?.id !== lastCompanyId) {
        lastCompanyId = r.companies?.id;
        const header = document.createElement('div');
        header.className = 'section-title';
        header.style.marginTop = '1.4rem';
        header.textContent = r.companies ? `🏢 ${r.companies.name}` : 'بدون شركة محددة';
        listEl.appendChild(header);
      }
      renderOneTaskCard(r, listEl);
    });
  }

  async function renderOneTaskCard(r, listEl) {
    const { data: openTimer } = await sb.from('task_timer_logs').select('*').eq('request_id', r.id).eq('staff_id', CURRENT_USER.id).is('ended_at', null).maybeSingle();
    const { data: latestDraftArr } = await sb.from('drafts').select('*').eq('request_id', r.id).order('version', { ascending: false }).limit(1);
    const latestDraft = (latestDraftArr || [])[0];
    const attachHtml = await attachmentsHtml(r.id);
    const finalHtml = await finalFileHtml(r);
    const inqHtml = await inquiriesHtml(r.id, 'staff');
    const card = document.createElement('div');
    card.className = `card ${priorityCardClass(r.priority)}`;
    card.innerHTML = `
      <div class="req-row">
        <div>
          <div class="req-title">${r.title} ${urgentChip(r.priority)}</div>
          <div class="req-meta">${r.services?.name_ar || ''}</div>
          ${companyChip(r.companies)}
        </div>
        ${statusBadge(r.status)}
      </div>
      ${progressBarHtml(r.status)}
      ${timestampsHtml(r)}
      ${r.description ? `<p class="req-meta" style="margin-top:.5rem">${r.description}</p>` : ''}
      ${latestDraft && latestDraft.status === 'client_revision_requested' ? `
        <div class="msg err" style="margin-top:.7rem"><strong>طلب العميل تعديل (نسخة ${latestDraft.version}):</strong><br>${latestDraft.client_notes || 'بدون ملاحظات مكتوبة'}</div>
      ` : ''}
      ${latestDraft && latestDraft.status === 'rejected_by_admin' ? `
        <div class="msg err" style="margin-top:.7rem"><strong>ملاحظات المدير على النسخة ${latestDraft.version}:</strong><br>${latestDraft.admin_notes || 'بدون ملاحظات مكتوبة'}</div>
      ` : ''}
      ${attachHtml}
      ${inqHtml}
      ${finalHtml}
      <div style="margin-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap">
        ${r.status === 'assigned' ? `<button class="btn btn-danger btn-sm" data-reject-assignment="${r.id}">رفض الإسناد</button>` : ''}
        ${!openTimer && r.status !== 'awaiting_final_file' && r.status !== 'completed' ? `<button class="btn btn-g btn-sm" data-start="${r.id}">بدء التنفيذ ←</button>` : ''}
        ${openTimer ? `<span class="live-pill"><span class="live-dot"></span>يعمل الآن</span> <button class="btn btn-danger btn-sm" data-stop="${openTimer.id}" data-req="${r.id}">إنهاء الجلسة</button>` : ''}
        <button class="btn btn-o btn-sm" data-ask-toggle="${r.id}">❓ طرح استفسار</button>
      </div>
      <div id="ask-form-${r.id}" style="display:none;margin-top:.7rem;border-top:1px solid var(--bd);padding-top:.7rem">
        <textarea id="ask-text-${r.id}" placeholder="مثال: أحتاج دخول لمنصة قوى لإتمام الطلب، أو أي استفسار للعميل..."></textarea>
        <button class="btn btn-g btn-sm" style="margin-top:.5rem" data-send-ask="${r.id}">إرسال الاستفسار ←</button>
        <div id="ask-msg-${r.id}"></div>
      </div>
      ${r.status !== 'awaiting_final_file' && r.status !== 'completed' ? `
        <div style="margin-top:.9rem;border-top:1px solid var(--bd);padding-top:.9rem">
          <label>رفع مسودة / ملف عمل (متاح دائمًا)</label>
          ${uploadWidgetHtml('draft-'+r.id)}
          <div style="display:flex;gap:.5rem;margin-top:.6rem;flex-wrap:wrap">
            <button class="btn btn-o btn-sm" data-submit-draft="${r.id}">رفع كمسودة ←</button>
            <button class="btn btn-o btn-sm" data-mark-done="${r.id}">تحديد كمنفَّذ بدون ملف ←</button>
          </div>
        </div>
        <div id="draft-msg-${r.id}"></div>
      ` : ''}
      ${r.status === 'awaiting_final_file' && !r.final_file_path ? `
        <div style="margin-top:.9rem;border-top:1px solid var(--bd);padding-top:.9rem">
          <div class="msg ok">✅ اعتمد العميل المسودة. آخر خطوة: ارفع الملف النهائي الرسمي.</div>
          <label style="margin-top:.6rem">📄 رفع الملف النهائي المعتمد</label>
          ${uploadWidgetHtml('final-'+r.id)}
          <button class="btn btn-g btn-sm" style="margin-top:.6rem" data-submit-final="${r.id}">رفع الملف النهائي ←</button>
          <div id="final-msg-${r.id}"></div>
        </div>
      ` : ''}
      ${r.status === 'awaiting_final_file' && r.final_file_path ? `
        <div style="margin-top:.9rem;border-top:1px solid var(--bd);padding-top:.9rem">
          <button class="btn btn-g" style="width:100%" data-complete-task="${r.id}">✅ إكمال المهمة نهائيًا</button>
        </div>
      ` : ''}
    `;
    listEl.appendChild(card);
    if (r.status !== 'awaiting_final_file' && r.status !== 'completed') wireUploadWidgetPreview('draft-'+r.id);
    if (r.status === 'awaiting_final_file' && !r.final_file_path) wireUploadWidgetPreview('final-'+r.id);
    wireOneTaskCardEvents(card);
    wireInquiryAnswerButtons(card, () => renderStaffTasks());
  }

  function wireOneTaskCardEvents(card) {
    card.querySelectorAll('[data-start]').forEach(btn => btn.addEventListener('click', async () => {
      btn.disabled = true;
      const ok1 = await runOrAlert(sb.from('task_timer_logs').insert({ request_id: btn.dataset.start, staff_id: CURRENT_USER.id }), 'تعذر بدء التنفيذ');
      if (!ok1) { btn.disabled = false; return; }
      const ok2 = await runOrAlert(sb.from('requests').update({ status: 'in_progress' }).eq('id', btn.dataset.start), 'تعذر تحديث حالة الطلب');
      if (!ok2) { btn.disabled = false; return; }
      renderStaffTasks();
    }));
    card.querySelectorAll('[data-stop]').forEach(btn => btn.addEventListener('click', async () => {
      btn.disabled = true;
      const ok = await runOrAlert(sb.from('task_timer_logs').update({ ended_at: new Date().toISOString() }).eq('id', btn.dataset.stop), 'تعذر إنهاء الجلسة');
      if (!ok) { btn.disabled = false; return; }
      renderStaffTasks();
    }));
    card.querySelectorAll('[data-submit-draft]').forEach(btn => btn.addEventListener('click', async () => {
      const reqId = btn.dataset.submitDraft;
      const files = collectUploadFiles('draft-'+reqId);
      const msgEl = document.getElementById(`draft-msg-${reqId}`);
      if (!files.length) { msgEl.innerHTML = `<div class="msg err">اختر ملفاً أولاً.</div>`; return; }
      msgEl.innerHTML = `<div class="msg ok">جاري الرفع...</div>`;
      const file = files[0];
      const path = `${reqId}/${Date.now()}_${file.name}`;
      const { error: upErr } = await sb.storage.from('drafts').upload(path, file);
      if (upErr) { msgEl.innerHTML = `<div class="msg err">فشل رفع الملف: ${upErr.message}</div>`; return; }
      const { data: existing } = await sb.from('drafts').select('version').eq('request_id', reqId).order('version', { ascending: false }).limit(1);
      const nextVersion = existing && existing[0] ? existing[0].version + 1 : 1;
      const { error: draftErr } = await sb.from('drafts').insert({ request_id: reqId, version: nextVersion, file_path: path, submitted_by: CURRENT_USER.id });
      if (draftErr) { msgEl.innerHTML = `<div class="msg err">فشل تسجيل المسودة: ${draftErr.message}</div>`; return; }
      const { error: reqErr } = await sb.from('requests').update({ status: 'pending_admin_review' }).eq('id', reqId);
      if (reqErr) { msgEl.innerHTML = `<div class="msg err">تم رفع الملف لكن فشل تحديث حالة الطلب: ${reqErr.message}</div>`; return; }
      msgEl.innerHTML = `<div class="msg ok">تم رفع المسودة، بانتظار مراجعة المدير.</div>`;
    }));

    card.querySelectorAll('[data-reject-assignment]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('هل أنت متأكد من رفض إسناد هذا الطلب؟ سيعود للإدارة لإعادة الإسناد.')) return;
      const ok = await runOrAlert(sb.from('requests').update({ assigned_staff_id: null, status: 'new' }).eq('id', btn.dataset.rejectAssignment), 'تعذر رفض الإسناد');
      if (ok) renderStaffTasks();
    }));

    card.querySelectorAll('[data-complete-task]').forEach(btn => btn.addEventListener('click', async () => {
      if (!confirm('هل أنت متأكد من إكمال هذه المهمة نهائيًا؟')) return;
      const ok = await runOrAlert(sb.from('requests').update({ status: 'completed' }).eq('id', btn.dataset.completeTask), 'تعذر إكمال المهمة');
      if (ok) renderStaffTasks();
    }));

    card.querySelectorAll('[data-mark-done]').forEach(btn => btn.addEventListener('click', async () => {
      const reqId = btn.dataset.markDone;
      const msgEl = document.getElementById(`draft-msg-${reqId}`);
      const { data: existing } = await sb.from('drafts').select('version').eq('request_id', reqId).order('version', { ascending: false }).limit(1);
      const nextVersion = existing && existing[0] ? existing[0].version + 1 : 1;
      const okInsert = await runOrAlert(sb.from('drafts').insert({ request_id: reqId, version: nextVersion, file_path: null, submitted_by: CURRENT_USER.id }), 'تعذر تسجيل الإنجاز');
      if (!okInsert) return;
      const okUpdate = await runOrAlert(sb.from('requests').update({ status: 'pending_admin_review' }).eq('id', reqId), 'تم التسجيل لكن فشل تحديث حالة الطلب');
      if (!okUpdate) return;
      msgEl.innerHTML = `<div class="msg ok">تم تحديد الطلب كمنفَّذ، بانتظار مراجعة المدير.</div>`;
      renderStaffTasks();
    }));

    card.querySelectorAll('[data-ask-toggle]').forEach(btn => btn.addEventListener('click', () => {
      const form = document.getElementById(`ask-form-${btn.dataset.askToggle}`);
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    }));
    card.querySelectorAll('[data-send-ask]').forEach(btn => btn.addEventListener('click', async () => {
      const reqId = btn.dataset.sendAsk;
      const question = document.getElementById(`ask-text-${reqId}`).value.trim();
      const msgEl = document.getElementById(`ask-msg-${reqId}`);
      if (!question) { msgEl.innerHTML = `<div class="msg err">اكتب استفسارك أولاً.</div>`; return; }
      const ok = await runOrAlert(sb.from('request_inquiries').insert({ request_id: reqId, asked_by: CURRENT_USER.id, question }), 'تعذر إرسال الاستفسار');
      if (ok) { msgEl.innerHTML = `<div class="msg ok">تم إرسال الاستفسار.</div>`; renderStaffTasks(); }
    }));

    card.querySelectorAll('[data-submit-final]').forEach(btn => btn.addEventListener('click', async () => {
      const reqId = btn.dataset.submitFinal;
      const files = collectUploadFiles('final-'+reqId);
      const msgEl = document.getElementById(`final-msg-${reqId}`);
      if (!files.length) { msgEl.innerHTML = `<div class="msg err">اختر الملف النهائي أولاً.</div>`; return; }
      msgEl.innerHTML = `<div class="msg ok">جاري الرفع...</div>`;
      const file = files[0];
      const path = `${reqId}/${Date.now()}_${file.name}`;
      const { error: upErr } = await sb.storage.from('final-documents').upload(path, file);
      if (upErr) { msgEl.innerHTML = `<div class="msg err">فشل رفع الملف: ${upErr.message}</div>`; return; }
      const ok = await runOrAlert(sb.from('requests').update({ final_file_path: path }).eq('id', reqId), 'تعذر حفظ الملف النهائي');
      if (ok) { msgEl.innerHTML = `<div class="msg ok">تم رفع الملف النهائي بنجاح.</div>`; renderStaffTasks(); }
    }));
  }
}

async function renderAdminDashboard() {
  const [{ data: requests }, { data: pendingDrafts }, { data: activeTimers }, { data: completedLogs }, { data: completedRequests }] = await Promise.all([
    sb.from('requests').select('*'),
    sb.from('drafts').select('*, requests(title)').eq('status', 'pending_admin_review'),
    sb.from('task_timer_logs').select('*, profiles!task_timer_logs_staff_id_fkey(full_name), requests(title)').is('ended_at', null),
    sb.from('task_timer_logs').select('*, profiles!task_timer_logs_staff_id_fkey(full_name)').not('ended_at', 'is', null),
    sb.from('requests').select('*, profiles!requests_assigned_staff_id_fkey(full_name)').eq('status', 'completed').not('started_at', 'is', null).not('completed_at', 'is', null),
  ]);

  const pendingCount = (pendingDrafts || []).length;

  app.innerHTML = `
    ${pendingCount > 0 ? `
      <div class="alert-banner">
        <span>⚠️ يوجد ${pendingCount} مسودة بانتظار مراجعتك — آخرها: "${pendingDrafts[0].requests?.title || ''}"</span>
        <button class="btn btn-g btn-sm" id="goToDraftsBtn">راجعها الآن ←</button>
      </div>` : ''}

    <div class="stats">
      <div class="stat"><div class="n">${(requests||[]).filter(r=>r.status==='new').length}</div><div class="l">طلبات جديدة</div></div>
      <div class="stat ${pendingCount>0?'highlight':''}"><div class="n">${pendingCount}</div><div class="l">مسودات بانتظار مراجعتك</div></div>
      <div class="stat"><div class="n">${(activeTimers||[]).length}</div><div class="l">موظفون يعملون الآن</div></div>
    </div>
    <div class="section-title">👁️ من يعمل الآن</div>
    <div class="card" id="liveActivity"></div>
    <div class="section-title">📊 تقرير الإنتاجية</div>
    <div class="card" id="productivityReport"></div>
  `;

  document.getElementById('goToDraftsBtn')?.addEventListener('click', () => navigate('drafts', 'تدقيق المسودات'));

  document.getElementById('liveActivity').innerHTML = (activeTimers && activeTimers.length)
    ? activeTimers.map(t => `<div class="req-row" style="padding:.5rem 0"><div><span class="live-pill"><span class="live-dot"></span>${t.profiles?.full_name||''}</span><span class="req-meta" style="display:inline;margin-right:.5rem">يعمل على: ${t.requests?.title||''}</span></div><span class="req-meta">بدأ ${timeAgo(t.started_at)}</span></div>`).join('')
    : emptyState('💤', 'لا يوجد أحد يعمل حالياً', '');

  const byStaff = {};
  (completedLogs || []).forEach(l => {
    const name = l.profiles?.full_name || 'غير معروف';
    if (!byStaff[name]) byStaff[name] = { count: 0, total: 0, onTime: 0, late: 0, rated: 0 };
    byStaff[name].count++; byStaff[name].total += (l.duration_seconds || 0);
  });
  (completedRequests || []).forEach(r => {
    const name = r.profiles?.full_name || 'غير معروف';
    if (!byStaff[name]) byStaff[name] = { count: 0, total: 0, onTime: 0, late: 0, rated: 0 };
    if (r.expected_hours) {
      const actualHours = (new Date(r.completed_at) - new Date(r.started_at)) / 3600000;
      byStaff[name].rated++;
      if (actualHours <= r.expected_hours) byStaff[name].onTime++; else byStaff[name].late++;
    }
  });
  const rows = Object.entries(byStaff);
  document.getElementById('productivityReport').innerHTML = rows.length ? `
    <table class="report"><tr><th>الموظف</th><th>المهام المنجزة</th><th>متوسط الوقت</th><th>الأداء الزمني</th></tr>
      ${rows.map(([name,s]) => `<tr><td>${name}</td><td>${s.count}</td><td>${fmtDuration(Math.round(s.total/(s.count||1)))}</td><td>${s.rated ? `✅ ${s.onTime} ضمن الوقت · ⚠️ ${s.late} متأخر` : '—'}</td></tr>`).join('')}
    </table>` : emptyState('📊', 'لا توجد بيانات إنتاجية مكتملة بعد', '');
}

async function renderAdminRequests() {
  const [{ data: requests }, { data: staffList }, { data: allAssigned }] = await Promise.all([
    sb.from('requests').select('*, services(name_ar), companies(name, cr_number)').order('created_at', { ascending: false }),
    sb.from('profiles').select('*').eq('role', 'staff').eq('is_active', true),
    sb.from('requests').select('assigned_staff_id, status, quality_rating').not('assigned_staff_id', 'is', null),
  ]);

  // quick workload/quality snapshot per staff, shown right in the assign dropdown
  const staffSnapshot = {};
  (staffList||[]).forEach(s => {
    const mine = (allAssigned||[]).filter(r => r.assigned_staff_id === s.id);
    const active = mine.filter(r => r.status !== 'completed').length;
    const rated = mine.filter(r => r.quality_rating);
    const avgQ = rated.length ? (rated.reduce((a,r)=>a+r.quality_rating,0)/rated.length).toFixed(1) : '—';
    staffSnapshot[s.id] = `${s.full_name} — ${active} نشطة${active>=3?' 🔴':' 🟢'} · جودة ${avgQ}`;
  });

  app.innerHTML = `<div id="allRequests"></div>`;
  const el = document.getElementById('allRequests');
  if (!requests || requests.length === 0) { el.innerHTML = emptyState('📋', 'لا توجد طلبات بعد', 'ستظهر هنا فور استلام أول طلب من العملاء'); return; }

  for (const r of requests) {
    const needsAssignment = !r.assigned_staff_id;
    const attachHtml = await attachmentsHtml(r.id);
    const finalHtml = await finalFileHtml(r);
    const inqHtml = await inquiriesHtml(r.id, 'admin');
    const versionHtml = await versionHistoryHtml(r.id);
    const card = document.createElement('div');
    card.className = `card ${priorityCardClass(r.priority)}`;
    card.innerHTML = `
      <div class="req-row">
        <div><div class="req-title">${r.title} ${urgentChip(r.priority)}</div><div class="req-meta">${r.services?.name_ar||''} · ${fmtDate(r.created_at)}</div>${companyChip(r.companies)}</div>
        ${statusBadge(r.status)}
      </div>
      ${progressBarHtml(r.status)}
      ${timestampsHtml(r)}
      ${attachHtml}
      ${inqHtml}
      ${finalHtml}
      ${versionHtml}
      <div style="margin-top:.7rem;display:flex;gap:.5rem;align-items:center;flex-wrap:wrap">
        <select data-priority-select="${r.id}" style="max-width:130px">
          <option value="normal" ${r.priority==='normal'?'selected':''}>عادي</option>
          <option value="urgent" ${r.priority==='urgent'?'selected':''}>🔴 عاجل</option>
        </select>
        ${needsAssignment ? `
          <select id="assign-${r.id}" style="max-width:280px"><option value="">إسناد إلى...</option>${(staffList||[]).map(s=>`<option value="${s.id}">${staffSnapshot[s.id]}</option>`).join('')}</select>
          <input id="expected-hours-${r.id}" type="number" min="0" step="0.5" placeholder="الوقت المتوقع (ساعة)" style="max-width:170px">
          <button class="btn btn-g btn-sm" data-assign-btn="${r.id}">إسناد ←</button>` : ''}
        ${r.status === 'completed' ? `
          <select data-quality-select="${r.id}" style="max-width:170px">
            <option value="">تقييم جودة العمل...</option>
            ${[5,4,3,2,1].map(n => `<option value="${n}" ${r.quality_rating==n?'selected':''}>${'⭐'.repeat(n)} (${n})</option>`).join('')}
          </select>` : ''}
      </div>
    `;
    el.appendChild(card);
    wireInquiryAnswerButtons(card, () => renderAdminRequests());
  }
  el.querySelectorAll('[data-quality-select]').forEach(sel => sel.addEventListener('change', async () => {
    const ok = await runOrAlert(sb.from('requests').update({ quality_rating: parseInt(sel.value) }).eq('id', sel.dataset.qualitySelect), 'تعذر حفظ التقييم');
    if (ok) renderAdminRequests();
  }));
  el.querySelectorAll('[data-priority-select]').forEach(sel => sel.addEventListener('change', async () => {
    const ok = await runOrAlert(sb.from('requests').update({ priority: sel.value }).eq('id', sel.dataset.prioritySelect), 'تعذر تحديث الأولوية');
    if (ok) renderAdminRequests();
  }));
  el.querySelectorAll('[data-assign-btn]').forEach(btn => btn.addEventListener('click', async () => {
    const reqId = btn.dataset.assignBtn;
    const staffId = document.getElementById(`assign-${reqId}`).value;
    if (!staffId) return;
    const expectedHoursVal = document.getElementById(`expected-hours-${reqId}`).value;
    const payload = { assigned_staff_id: staffId, status: 'assigned' };
    if (expectedHoursVal) payload.expected_hours = parseFloat(expectedHoursVal);
    const ok = await runOrAlert(sb.from('requests').update(payload).eq('id', reqId), 'تعذر إسناد الطلب');
    if (ok) renderAdminRequests();
  }));
}

async function seedComplianceReminders(companyId) {
  const { data: existing } = await sb.from('compliance_reminders').select('id').eq('company_id', companyId).limit(1);
  if (existing && existing.length) return; // لا تكرر لو أُضيفت من قبل

  const { data: templates } = await sb.from('reminder_templates').select('*').eq('is_active', true);
  if (!templates || !templates.length) return;

  const today = new Date();
  const rows = templates.map(t => {
    const due = new Date(today);
    if (t.default_recurrence === 'monthly') due.setMonth(due.getMonth() + 1);
    else if (t.default_recurrence === 'quarterly') due.setMonth(due.getMonth() + 3);
    else due.setFullYear(due.getFullYear() + 1);
    return {
      company_id: companyId,
      template_id: t.id,
      title: t.title,
      description: t.description,
      due_date: due.toISOString().slice(0, 10),
      reminder_days_before: t.default_reminder_days_before,
      recurrence: t.default_recurrence,
    };
  });
  await sb.from('compliance_reminders').insert(rows);
}

async function loadReminders(companyId) {
  const { data: reminders } = await sb.from('compliance_reminders').select('*').eq('company_id', companyId).order('due_date');
  const el = document.getElementById('remindersList');
  if (!reminders || !reminders.length) { el.innerHTML = `<div class="card"><div class="req-meta">لا توجد مواعيد مسجّلة بعد.</div></div>`; return; }
  el.innerHTML = '';
  const today = new Date().toISOString().slice(0, 10);
  reminders.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    const overdue = r.due_date < today && r.status === 'pending';
    card.innerHTML = `
      <div class="req-row">
        <div><div class="req-title">${r.title}</div><div class="req-meta">الاستحقاق: ${fmtDate(r.due_date)} · تذكير قبلها بـ${r.reminder_days_before} يوم · ${r.recurrence === 'yearly' ? 'يتكرر سنوياً' : r.recurrence === 'quarterly' ? 'يتكرر ربع سنوياً' : r.recurrence === 'monthly' ? 'يتكرر شهرياً' : 'مرة واحدة'}</div></div>
        ${r.status === 'done' ? `<span class="badge b-active">تم السداد</span>` : overdue ? `<span class="badge b-pending" style="background:#fde2e2;color:#a11">متأخر</span>` : `<span class="badge b-pending">قادم</span>`}
      </div>
      ${r.status === 'pending' ? `<button class="btn btn-o btn-sm" data-mark-done="${r.id}" data-recur="${r.recurrence}" data-due="${r.due_date}" style="margin-top:.5rem;">تأشير كمدفوع/مكتمل ←</button>` : ''}
    `;
    el.appendChild(card);
  });
  el.querySelectorAll('[data-mark-done]').forEach(btn => btn.addEventListener('click', async () => {
    const id = btn.dataset.markDone;
    const recur = btn.dataset.recur;
    const due = new Date(btn.dataset.due);
    if (recur === 'none') {
      await sb.from('compliance_reminders').update({ status: 'done' }).eq('id', id);
    } else {
      if (recur === 'monthly') due.setMonth(due.getMonth() + 1);
      else if (recur === 'quarterly') due.setMonth(due.getMonth() + 3);
      else due.setFullYear(due.getFullYear() + 1);
      await sb.from('compliance_reminders').update({ due_date: due.toISOString().slice(0, 10), status: 'pending', last_reminded_at: null }).eq('id', id);
    }
    loadReminders(companyId);
  }));
}

// =====================================================================
// ADMIN: TEAM SCORECARDS (speed, quality, workload, reach — per staff)
// =====================================================================
async function renderAdminTeam() {
  const [{ data: staffList }, { data: allRequests }, { data: allDrafts }] = await Promise.all([
    sb.from('profiles').select('*').eq('role', 'staff').eq('is_active', true),
    sb.from('requests').select('*, services(name_ar)').not('assigned_staff_id', 'is', null),
    sb.from('drafts').select('id, request_id, status, submitted_by'),
  ]);

  if (!staffList || staffList.length === 0) {
    app.innerHTML = `<div id="teamList"></div>`;
    document.getElementById('teamList').innerHTML = emptyState('👥', 'لا يوجد فريق عمل مسجّل بعد', '');
    return;
  }

  const servicesInvolved = [...new Map((allRequests||[]).filter(r=>r.services).map(r=>[r.services.name_ar, r.services])).values()];
  const LEADERBOARDS = [
    { key: 'overall', label: 'الأداء العام' },
    { key: 'speed', label: 'الأسرع' },
    { key: 'quality', label: 'الأعلى جودة' },
    { key: 'ontime', label: 'الأكثر التزامًا' },
    { key: 'capacity', label: 'الأكثر تحمّلًا' },
  ];

  app.innerHTML = `
    <div class="card">
      <div class="upload-row" id="teamLeaderboardTabs">
        ${LEADERBOARDS.map((lb,i) => `<button class="btn ${i===0?'btn-g':'btn-o'} btn-sm" data-lb="${lb.key}">${lb.label}</button>`).join('')}
      </div>
      ${servicesInvolved.length ? `
        <div style="margin-top:.8rem">
          <label>تصفية حسب الخدمة</label>
          <select id="teamServiceFilter">
            <option value="">كل الخدمات</option>
            ${servicesInvolved.map(s => `<option value="${s.name_ar}">${s.name_ar}</option>`).join('')}
          </select>
        </div>` : ''}
    </div>
    <div id="teamList"></div>
  `;

  // Build a scorecard per staff member
  const scorecards = staffList.map(staff => {
    const mine = (allRequests || []).filter(r => r.assigned_staff_id === staff.id);
    const activeTasks = mine.filter(r => r.status !== 'completed');
    const completedTasks = mine.filter(r => r.status === 'completed');
    const servicesHandled = [...new Map(mine.filter(r=>r.services).map(r=>[r.services.name_ar, r.services])).values()];
    const companiesAllTime = new Set(mine.filter(r=>r.company_id).map(r=>r.company_id));
    const companiesActive = new Set(activeTasks.filter(r=>r.company_id).map(r=>r.company_id));

    const rated = completedTasks.filter(r => r.quality_rating);
    const avgQuality = rated.length ? rated.reduce((s,r)=>s+r.quality_rating,0)/rated.length : null;

    const clientRated = completedTasks.filter(r => r.client_rating);
    const avgClientRating = clientRated.length ? clientRated.reduce((s,r)=>s+r.client_rating,0)/clientRated.length : null;

    const timed = completedTasks.filter(r => r.started_at && r.completed_at);
    const avgHours = timed.length ? timed.reduce((s,r)=> s + (new Date(r.completed_at)-new Date(r.started_at))/3600000, 0) / timed.length : null;

    const withExpected = timed.filter(r => r.expected_hours);
    let avgSpeed = null, onTimePct = null;
    if (withExpected.length) {
      const speedScores = withExpected.map(r => {
        const actualHours = (new Date(r.completed_at) - new Date(r.started_at)) / 3600000;
        const ratio = r.expected_hours / Math.max(actualHours, 0.01);
        if (ratio >= 1.2) return 5;
        if (ratio >= 1.0) return 4;
        if (ratio >= 0.8) return 3;
        if (ratio >= 0.6) return 2;
        return 1;
      });
      avgSpeed = speedScores.reduce((a,b)=>a+b,0) / speedScores.length;
      const onTimeCount = withExpected.filter(r => {
        const actualHours = (new Date(r.completed_at) - new Date(r.started_at)) / 3600000;
        return actualHours <= r.expected_hours;
      }).length;
      onTimePct = Math.round((onTimeCount / withExpected.length) * 100);
    }

    // revision rate: of requests this staff submitted at least one draft for,
    // what % ever got a 'client_revision_requested' draft
    const myRequestIds = new Set(mine.map(r=>r.id));
    const myDrafts = (allDrafts||[]).filter(d => myRequestIds.has(d.request_id));
    const requestsWithDrafts = new Set(myDrafts.map(d=>d.request_id));
    const requestsWithRevision = new Set(myDrafts.filter(d=>d.status==='client_revision_requested').map(d=>d.request_id));
    const revisionRate = requestsWithDrafts.size ? Math.round((requestsWithRevision.size / requestsWithDrafts.size) * 100) : null;

    let overall = null;
    const parts = [avgQuality, avgSpeed, avgClientRating].filter(v => v !== null);
    if (parts.length) overall = parts.reduce((a,b)=>a+b,0) / parts.length;

    return { staff, activeCount: activeTasks.length, completedCount: completedTasks.length, totalCount: mine.length,
             servicesHandled, companiesAllTime: companiesAllTime.size, companiesActive: companiesActive.size,
             avgQuality, avgClientRating, avgSpeed, avgHours, onTimePct, revisionRate, overall };
  });

  function starsHtml(n) {
    if (n === null) return `<span class="req-meta">لا توجد بيانات كافية بعد</span>`;
    const full = Math.round(n);
    return `${'⭐'.repeat(full)}${'☆'.repeat(5-full)} <span class="req-meta">(${n.toFixed(1)})</span>`;
  }
  function hoursHtml(h) {
    if (h === null) return '—';
    if (h < 24) return `${h.toFixed(1)} ساعة`;
    return `${(h/24).toFixed(1)} يوم`;
  }

  let currentLb = 'overall';

  function sortFor(lb, list) {
    const sorted = [...list];
    if (lb === 'speed') sorted.sort((a,b) => (b.avgSpeed ?? -1) - (a.avgSpeed ?? -1));
    else if (lb === 'quality') sorted.sort((a,b) => (b.avgQuality ?? -1) - (a.avgQuality ?? -1));
    else if (lb === 'ontime') sorted.sort((a,b) => (b.onTimePct ?? -1) - (a.onTimePct ?? -1));
    else if (lb === 'capacity') sorted.sort((a,b) => b.totalCount - a.totalCount);
    else sorted.sort((a,b) => (b.overall ?? -1) - (a.overall ?? -1));
    return sorted;
  }

  function renderList(filterService) {
    const listEl = document.getElementById('teamList');
    listEl.innerHTML = '';
    let list = filterService ? scorecards.filter(sc => sc.servicesHandled.some(s=>s.name_ar===filterService)) : scorecards;
    list = sortFor(currentLb, list);
    if (!list.length) { listEl.innerHTML = emptyState('👥', 'لا يوجد موظفون ضمن هذه الخدمة بعد', ''); return; }

    list.forEach((sc, i) => {
      const rankBadge = i===0 ? '🥇 ' : i===1 ? '🥈 ' : i===2 ? '🥉 ' : '';
      const busy = sc.activeCount >= 3;
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="req-row">
          <div>
            <div class="req-title">${rankBadge}${sc.staff.full_name}</div>
            <div class="req-meta">${sc.servicesHandled.map(s=>s.name_ar).join(' · ') || 'لم يُسند له عمل بعد'}</div>
          </div>
          <span class="badge ${busy?'b-review':'b-active'}">${busy?'🔴 مشغول':'🟢 متاح'} · ${sc.activeCount} نشطة</span>
        </div>
        <div class="stats" style="margin-top:.9rem;margin-bottom:0">
          <div class="stat"><div class="n">${sc.totalCount}</div><div class="l">إجمالي المهام</div></div>
          <div class="stat"><div class="n">${sc.completedCount}</div><div class="l">مهام منجزة</div></div>
          <div class="stat"><div class="n">${sc.companiesActive}</div><div class="l">شركات نشطة الآن</div></div>
          <div class="stat"><div class="n">${sc.companiesAllTime}</div><div class="l">إجمالي الشركات</div></div>
        </div>
        <div style="margin-top:.9rem;border-top:1px solid var(--bd);padding-top:.9rem">
          <div class="req-meta" style="margin-bottom:.4rem"><strong style="color:var(--t)">تقييم جودة العمل (الإدارة):</strong> ${starsHtml(sc.avgQuality)}</div>
          <div class="req-meta" style="margin-bottom:.4rem"><strong style="color:var(--t)">تقييم العملاء:</strong> ${starsHtml(sc.avgClientRating)}</div>
          <div class="req-meta" style="margin-bottom:.4rem"><strong style="color:var(--t)">تقييم السرعة:</strong> ${starsHtml(sc.avgSpeed)}</div>
          <div class="req-meta" style="margin-bottom:.4rem"><strong style="color:var(--t)">متوسط وقت الإنجاز:</strong> ${hoursHtml(sc.avgHours)}</div>
          <div class="req-meta" style="margin-bottom:.4rem"><strong style="color:var(--t)">الالتزام بالوقت المتوقع:</strong> ${sc.onTimePct!==null ? sc.onTimePct+'%' : '—'}</div>
          <div class="req-meta"><strong style="color:var(--t)">نسبة إعادة العمل للتعديل:</strong> ${sc.revisionRate!==null ? sc.revisionRate+'%' : '—'}</div>
        </div>
        <button class="btn btn-o btn-sm" style="margin-top:.8rem" data-toggle-detail="${sc.staff.id}">عرض تفاصيل المهام ←</button>
        <div id="detail-${sc.staff.id}" style="display:none;margin-top:.8rem"></div>
      `;
      listEl.appendChild(card);

      card.querySelector('[data-toggle-detail]').addEventListener('click', async () => {
        const box = document.getElementById(`detail-${sc.staff.id}`);
        if (box.style.display === 'block') { box.style.display = 'none'; return; }
        const mine = (allRequests||[]).filter(r => r.assigned_staff_id === sc.staff.id).sort((a,b)=> new Date(b.created_at)-new Date(a.created_at));
        box.innerHTML = mine.length ? mine.map(r => `
          <div style="padding:.6rem 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap">
            <span class="req-meta">${r.title} — ${r.services?.name_ar||''}</span>
            <span class="req-meta">${statusBadge(r.status)} ${r.quality_rating?`· جودة: ${'⭐'.repeat(r.quality_rating)}`:''} ${r.client_rating?`· عميل: ${'⭐'.repeat(r.client_rating)}`:''}</span>
          </div>`).join('') : `<div class="req-meta">لا توجد مهام</div>`;
        box.style.display = 'block';
      });
    });
  }

  document.getElementById('teamServiceFilter')?.addEventListener('change', e => renderList(e.target.value));
  document.querySelectorAll('#teamLeaderboardTabs [data-lb]').forEach(btn => btn.addEventListener('click', () => {
    currentLb = btn.dataset.lb;
    document.querySelectorAll('#teamLeaderboardTabs [data-lb]').forEach(b => b.className = 'btn btn-o btn-sm');
    btn.className = 'btn btn-g btn-sm';
    renderList(document.getElementById('teamServiceFilter')?.value || '');
  }));
  renderList('');
}

const AUDIT_ACTION_LABELS = {
  created: '📄 أُنشئ الطلب',
  assigned: '👤 أُسند لموظف',
  assignment_rejected: '↩️ رفض الموظف الإسناد',
  started: '▶️ بدأ التنفيذ',
  draft_uploaded: '📤 رفع مسودة',
  draft_approved: '✅ اعتمد المدير المسودة',
  draft_rejected: '❌ رفض المدير المسودة',
  client_approved: '✅ اعتمد العميل المسودة',
  client_revision_requested: '✏️ طلب العميل تعديلاً',
  final_uploaded: '📄 رُفع الملف النهائي',
  completed: '🏁 اكتمل الطلب',
  company_edited: '🏢 عُدّلت بيانات الشركة',
  company_activated: '🔓 فُعّلت الشركة',
};

async function renderAdminAuditLog() {
  const { data: logs } = await sb.from('audit_log').select('*, profiles(full_name)').order('created_at', { ascending: false }).limit(200);
  app.innerHTML = `
    <div class="card">
      <label>تصفية حسب نوع الإجراء</label>
      <select id="auditActionFilter">
        <option value="">كل الإجراءات</option>
        ${Object.entries(AUDIT_ACTION_LABELS).map(([k,v]) => `<option value="${k}">${v}</option>`).join('')}
      </select>
    </div>
    <div id="auditList"></div>
  `;

  function renderLogs(filterAction) {
    const el = document.getElementById('auditList');
    const filtered = filterAction ? (logs||[]).filter(l => l.action === filterAction) : (logs||[]);
    if (!filtered.length) { el.innerHTML = emptyState('🧾', 'لا يوجد سجل تدقيق بعد', ''); return; }
    el.innerHTML = filtered.map(l => `
      <div class="card" style="padding:.9rem 1.1rem">
        <div class="req-row">
          <span class="req-title" style="font-size:.85rem">${AUDIT_ACTION_LABELS[l.action] || l.action}</span>
          <span class="req-meta">${timeAgo(l.created_at)}</span>
        </div>
        <div class="req-meta" style="margin-top:.3rem">
          بواسطة: ${l.profiles?.full_name || 'النظام'} (${roleLabel(l.actor_role) || '—'})
          · النوع: ${l.entity_type}
        </div>
      </div>
    `).join('');
  }

  document.getElementById('auditActionFilter').addEventListener('change', e => renderLogs(e.target.value));
  renderLogs('');
}

init();
</script>
</body>
</html>
