<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صمام | لوحة التحكم</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --g:#3A584B; --g2:#4a6d5c; --gold:#BCA569; --gold2:#cdbb8a;
    --w:#FFFFFF; --off:#F7F6F2; --t:#1c2621; --t2:#4a534d; --t3:#7c847e; --bd:#e4e2da;
    --warn-bg:#fdf3e3; --warn-t:#8a5a00; --ok-bg:#eaf5ee; --ok-t:#1e6b3a; --err-bg:#fdecec; --err-t:#b3261e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Tajawal',sans-serif;background:var(--off);color:var(--t);min-height:100vh}
  .topbar{background:var(--g);padding:.9rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}
  .topbar-l{display:flex;align-items:center;gap:.7rem}
  .topbar img{width:36px;height:auto}
  .topbar .tn{color:#fff;font-size:.95rem;font-weight:700}
  .topbar .tr{color:var(--gold2);font-size:.7rem}
  .topbar-r{display:flex;align-items:center;gap:.8rem}
  .who{color:rgba(255,255,255,.85);font-size:.82rem}
  .logout{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);padding:.45rem .9rem;border-radius:8px;font-family:inherit;font-size:.78rem;cursor:pointer}
  .logout:hover{background:rgba(255,255,255,.2)}
  .wrap{max-width:960px;margin:0 auto;padding:1.5rem}
  .section-title{font-size:1rem;font-weight:800;margin:1.6rem 0 .8rem}
  .section-title:first-child{margin-top:0}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.7rem;margin-bottom:1.5rem}
  .stat{background:#fff;border:1px solid var(--bd);border-radius:10px;padding:1rem;text-align:center}
  .stat .n{font-size:1.5rem;font-weight:800;color:var(--g)}
  .stat .l{font-size:.72rem;color:var(--t3);margin-top:.2rem}
  .card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:1.2rem;margin-bottom:.9rem}
  .req-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.6rem}
  .req-title{font-size:.9rem;font-weight:700}
  .req-meta{font-size:.75rem;color:var(--t3);margin-top:.2rem}
  .badge{font-size:.72rem;font-weight:700;padding:.3rem .7rem;border-radius:100px;white-space:nowrap}
  .b-new{background:#eef1f4;color:#445}
  .b-progress{background:var(--warn-bg);color:var(--warn-t)}
  .b-review{background:#eef1f4;color:#445}
  .b-approval{background:var(--warn-bg);color:var(--warn-t)}
  .b-revision{background:var(--err-bg);color:var(--err-t)}
  .b-done{background:var(--ok-bg);color:var(--ok-t)}
  .btn{display:inline-block;padding:.55rem 1rem;border:none;border-radius:8px;font-family:inherit;font-size:.8rem;font-weight:700;cursor:pointer;text-decoration:none}
  .btn-g{background:var(--g);color:#fff}
  .btn-g:hover{background:var(--g2)}
  .btn-o{background:transparent;border:1px solid var(--bd);color:var(--t2)}
  .btn-o:hover{background:var(--off)}
  .btn-danger{background:var(--err-bg);color:var(--err-t);border:1px solid #f3c9c6}
  .btn-sm{padding:.4rem .8rem;font-size:.75rem}
  form.new-req{display:grid;gap:.8rem}
  label{font-size:.78rem;font-weight:700;color:var(--t2);display:block;margin-bottom:.3rem}
  input,textarea,select{width:100%;padding:.65rem .8rem;border:1px solid var(--bd);border-radius:8px;font-family:inherit;font-size:.85rem;background:var(--off)}
  textarea{resize:vertical;min-height:70px}
  .draft-item{border-top:1px solid var(--bd);padding-top:.7rem;margin-top:.7rem}
  .notif{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;border-top:1px solid var(--bd);font-size:.82rem}
  .notif:first-child{border-top:none}
  .notif.unread{font-weight:700}
  .empty{color:var(--t3);font-size:.85rem;text-align:center;padding:2rem 0}
  .loading{text-align:center;padding:3rem;color:var(--t3)}
  .msg{font-size:.82rem;padding:.7rem .9rem;border-radius:8px;margin-bottom:1rem}
  .msg.err{background:var(--err-bg);color:var(--err-t)}
  .msg.ok{background:var(--ok-bg);color:var(--ok-t)}
</style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-l">
      <img src="assets/logo.png" alt="صمام">
      <div><div class="tn">صمام</div><div class="tr">من إتقان لخدمات الأعمال</div></div>
    </div>
    <div class="topbar-r">
      <span class="who" id="whoami">...</span>
      <button class="logout" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </div>

  <div class="wrap" id="app">
    <div class="loading">جاري التحميل...</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://rvdhaylilyfclxbkpwud.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2ZGhheWxpbHlmY2x4Ymtwd3VkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMTk0MDEsImV4cCI6MjEwNDc5NTQwMX0.adDwLJNuYyOVd-z-qJaThwl0D0_7Sb0wsPvt8MhEU94";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS_LABELS = {
  new: ['جديد', 'b-new'],
  assigned: ['مُسند', 'b-new'],
  in_progress: ['قيد التنفيذ', 'b-progress'],
  pending_admin_review: ['بانتظار مراجعة المدير', 'b-review'],
  pending_client_approval: ['بانتظار اعتمادك', 'b-approval'],
  client_revision_requested: ['طلب تعديل', 'b-revision'],
  completed: ['مكتمل', 'b-done'],
};

const app = document.getElementById('app');
let CURRENT_USER = null;
let CURRENT_PROFILE = null;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = 'index.html'; return; }
  CURRENT_USER = session.user;

  const { data: profile, error } = await sb.from('profiles').select('*').eq('id', CURRENT_USER.id).single();
  if (error || !profile) {
    app.innerHTML = `<div class="msg err">تعذر تحميل بيانات حسابك. تواصل مع الإدارة.</div>`;
    return;
  }
  CURRENT_PROFILE = profile;
  document.getElementById('whoami').textContent = `${profile.full_name} · ${roleLabel(profile.role)}`;

  if (profile.role === 'admin') renderAdmin();
  else if (profile.role === 'staff') renderStaff();
  else renderClient();
}

function roleLabel(r) { return { client: 'عميل', staff: 'فريق العمل', admin: 'إدارة' }[r] || r; }
function statusBadge(s) { const [label, cls] = STATUS_LABELS[s] || [s, 'b-new']; return `<span class="badge ${cls}">${label}</span>`; }
function fmtDate(d) { return new Date(d).toLocaleDateString('ar-SA', { year: 'numeric', month: 'short', day: 'numeric' }); }

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await sb.auth.signOut();
  window.location.href = 'index.html';
});

// =====================================================================
// CLIENT DASHBOARD
// =====================================================================
async function renderClient() {
  const { data: requests } = await sb.from('requests').select('*, services(name_ar)').eq('client_id', CURRENT_USER.id).order('created_at', { ascending: false });
  const { data: services } = await sb.from('services').select('*').eq('is_active', true);

  const counts = { pending_client_approval: 0, in_progress: 0, completed: 0 };
  (requests || []).forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });

  app.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="n">${counts.pending_client_approval}</div><div class="l">بانتظار اعتمادك</div></div>
      <div class="stat"><div class="n">${counts.in_progress}</div><div class="l">قيد التنفيذ</div></div>
      <div class="stat"><div class="n">${counts.completed}</div><div class="l">مكتملة</div></div>
    </div>

    <div class="section-title">طلب جديد</div>
    <div class="card">
      <form class="new-req" id="newReqForm">
        <div><label>الخدمة</label><select id="nr-service" required>
          <option value="">اختر الخدمة...</option>
          ${(services || []).map(s => `<option value="${s.id}">${s.name_ar}</option>`).join('')}
        </select></div>
        <div><label>عنوان الطلب</label><input id="nr-title" required placeholder="مثال: مراجعة فواتير شهر سبتمبر"></div>
        <div><label>تفاصيل إضافية</label><textarea id="nr-desc" placeholder="أي تفاصيل تساعد فريقنا..."></textarea></div>
        <button type="submit" class="btn btn-g">إرسال الطلب ←</button>
      </form>
      <div id="nr-msg"></div>
    </div>

    <div class="section-title">طلباتي</div>
    <div id="reqList"></div>
  `;

  document.getElementById('newReqForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const service_id = document.getElementById('nr-service').value;
    const title = document.getElementById('nr-title').value.trim();
    const description = document.getElementById('nr-desc').value.trim();
    const { error } = await sb.from('requests').insert({ client_id: CURRENT_USER.id, service_id, title, description, status: 'new' });
    const msgEl = document.getElementById('nr-msg');
    if (error) { msgEl.innerHTML = `<div class="msg err">تعذر إرسال الطلب: ${error.message}</div>`; }
    else { msgEl.innerHTML = `<div class="msg ok">تم إرسال طلبك بنجاح.</div>`; e.target.reset(); renderClient(); }
  });

  const listEl = document.getElementById('reqList');
  if (!requests || requests.length === 0) { listEl.innerHTML = `<div class="empty">لا توجد طلبات بعد.</div>`; return; }

  for (const r of requests) {
    const { data: drafts } = await sb.from('drafts').select('*').eq('request_id', r.id).order('version', { ascending: false });
    const visibleDraft = (drafts || [])[0]; // RLS already ensures only client-visible drafts are returned

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="req-row">
        <div>
          <div class="req-title">${r.title}</div>
          <div class="req-meta">${r.services?.name_ar || ''} · ${fmtDate(r.created_at)}</div>
        </div>
        ${statusBadge(r.status)}
      </div>
      ${visibleDraft ? `
        <div class="draft-item">
          <div class="req-meta" style="margin-bottom:.5rem">مسودة النسخة ${visibleDraft.version} — ${statusBadge(visibleDraft.status)}</div>
          ${visibleDraft.status === 'approved_for_client' ? `
            <div style="display:flex;gap:.5rem">
              <button class="btn btn-g btn-sm" data-approve="${visibleDraft.id}" data-req="${r.id}">اعتماد ←</button>
              <button class="btn btn-o btn-sm" data-revise="${visibleDraft.id}">طلب تعديل</button>
            </div>
            <div id="rev-form-${visibleDraft.id}" style="display:none;margin-top:.6rem">
              <textarea id="rev-notes-${visibleDraft.id}" placeholder="اكتب ملاحظاتك..."></textarea>
              <button class="btn btn-g btn-sm" style="margin-top:.5rem" data-send-revision="${visibleDraft.id}" data-req="${r.id}">إرسال الملاحظات ←</button>
            </div>
          ` : ''}
        </div>
      ` : ''}
    `;
    listEl.appendChild(card);
  }

  listEl.querySelectorAll('[data-approve]').forEach(btn => btn.addEventListener('click', async () => {
    const draftId = btn.dataset.approve, reqId = btn.dataset.req;
    await sb.from('drafts').update({ status: 'approved_by_client' }).eq('id', draftId);
    await sb.from('requests').update({ status: 'completed' }).eq('id', reqId);
    renderClient();
  }));
  listEl.querySelectorAll('[data-revise]').forEach(btn => btn.addEventListener('click', () => {
    document.getElementById(`rev-form-${btn.dataset.revise}`).style.display = 'block';
  }));
  listEl.querySelectorAll('[data-send-revision]').forEach(btn => btn.addEventListener('click', async () => {
    const draftId = btn.dataset.sendRevision, reqId = btn.dataset.req;
    const notes = document.getElementById(`rev-notes-${draftId}`).value.trim();
    await sb.from('drafts').update({ status: 'client_revision_requested', client_notes: notes }).eq('id', draftId);
    await sb.from('requests').update({ status: 'client_revision_requested' }).eq('id', reqId);
    renderClient();
  }));
}

// =====================================================================
// STAFF DASHBOARD
// =====================================================================
async function renderStaff() {
  const { data: requests } = await sb.from('requests').select('*, services(name_ar), profiles!requests_client_id_fkey(full_name, company_name)').eq('assigned_staff_id', CURRENT_USER.id).order('created_at', { ascending: false });

  app.innerHTML = `<div class="section-title">مهامي</div><div id="taskList"></div>`;
  const listEl = document.getElementById('taskList');
  if (!requests || requests.length === 0) { listEl.innerHTML = `<div class="empty">لا توجد مهام مسندة إليك حالياً.</div>`; return; }

  for (const r of requests) {
    const { data: openTimer } = await sb.from('task_timer_logs').select('*').eq('request_id', r.id).eq('staff_id', CURRENT_USER.id).is('ended_at', null).maybeSingle();

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="req-row">
        <div>
          <div class="req-title">${r.title}</div>
          <div class="req-meta">${r.services?.name_ar || ''} · ${r.profiles?.company_name || r.profiles?.full_name || ''}</div>
        </div>
        ${statusBadge(r.status)}
      </div>
      <div style="margin-top:.8rem;display:flex;gap:.5rem;flex-wrap:wrap">
        ${!openTimer ? `<button class="btn btn-g btn-sm" data-start="${r.id}">بدء التنفيذ ←</button>`
                     : `<button class="btn btn-danger btn-sm" data-stop="${openTimer.id}" data-req="${r.id}">إنهاء الجلسة</button>`}
        <label style="margin-right:.5rem"><input type="file" data-upload-draft="${r.id}" style="font-size:.75rem"></label>
      </div>
      <div id="draft-msg-${r.id}"></div>
    `;
    listEl.appendChild(card);
  }

  listEl.querySelectorAll('[data-start]').forEach(btn => btn.addEventListener('click', async () => {
    const reqId = btn.dataset.start;
    await sb.from('task_timer_logs').insert({ request_id: reqId, staff_id: CURRENT_USER.id });
    await sb.from('requests').update({ status: 'in_progress' }).eq('id', reqId);
    renderStaff();
  }));
  listEl.querySelectorAll('[data-stop]').forEach(btn => btn.addEventListener('click', async () => {
    await sb.from('task_timer_logs').update({ ended_at: new Date().toISOString() }).eq('id', btn.dataset.stop);
    renderStaff();
  }));
  listEl.querySelectorAll('[data-upload-draft]').forEach(input => input.addEventListener('change', async (e) => {
    const reqId = input.dataset.uploadDraft;
    const file = e.target.files[0];
    if (!file) return;
    const path = `${reqId}/${Date.now()}_${file.name}`;
    const { error: upErr } = await sb.storage.from('drafts').upload(path, file);
    const msgEl = document.getElementById(`draft-msg-${reqId}`);
    if (upErr) { msgEl.innerHTML = `<div class="msg err">فشل رفع الملف: ${upErr.message}</div>`; return; }

    const { data: existing } = await sb.from('drafts').select('version').eq('request_id', reqId).order('version', { ascending: false }).limit(1);
    const nextVersion = existing && existing[0] ? existing[0].version + 1 : 1;
    const { error: draftErr } = await sb.from('drafts').insert({ request_id: reqId, version: nextVersion, file_path: path, submitted_by: CURRENT_USER.id });
    if (draftErr) { msgEl.innerHTML = `<div class="msg err">فشل تسجيل المسودة: ${draftErr.message}</div>`; return; }

    await sb.from('requests').update({ status: 'pending_admin_review' }).eq('id', reqId);
    msgEl.innerHTML = `<div class="msg ok">تم رفع المسودة، بانتظار مراجعة المدير.</div>`;
  }));
}

// =====================================================================
// ADMIN DASHBOARD
// =====================================================================
async function renderAdmin() {
  const [{ data: requests }, { data: staffList }, { data: pendingDrafts }, { data: notifications }] = await Promise.all([
    sb.from('requests').select('*, services(name_ar), profiles!requests_client_id_fkey(full_name, company_name)').order('created_at', { ascending: false }),
    sb.from('profiles').select('*').eq('role', 'staff').eq('is_active', true),
    sb.from('drafts').select('*, requests(title)').eq('status', 'pending_admin_review'),
    sb.from('notifications').select('*').eq('recipient_id', CURRENT_USER.id).order('created_at', { ascending: false }).limit(10),
  ]);

  app.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="n">${(requests||[]).filter(r=>r.status==='new').length}</div><div class="l">طلبات جديدة</div></div>
      <div class="stat"><div class="n">${(pendingDrafts||[]).length}</div><div class="l">مسودات بانتظار مراجعتك</div></div>
      <div class="stat"><div class="n">${(requests||[]).filter(r=>r.status==='in_progress').length}</div><div class="l">قيد التنفيذ</div></div>
    </div>

    <div class="section-title">🔔 آخر الإشعارات</div>
    <div class="card" id="notifBox"></div>

    <div class="section-title">بوابة تدقيق المسودات</div>
    <div id="draftReview"></div>

    <div class="section-title">كل الطلبات</div>
    <div id="allRequests"></div>
  `;

  const notifBox = document.getElementById('notifBox');
  notifBox.innerHTML = (notifications && notifications.length)
    ? notifications.map(n => `<div class="notif ${!n.is_read?'unread':''}">${n.message}</div>`).join('')
    : `<div class="empty">لا توجد إشعارات.</div>`;

  const draftEl = document.getElementById('draftReview');
  if (!pendingDrafts || pendingDrafts.length === 0) {
    draftEl.innerHTML = `<div class="empty">لا توجد مسودات بانتظار المراجعة.</div>`;
  } else {
    pendingDrafts.forEach(d => {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="req-title">${d.requests?.title || ''} — نسخة ${d.version}</div>
        <div style="margin-top:.7rem;display:flex;gap:.5rem">
          <button class="btn btn-g btn-sm" data-approve-draft="${d.id}" data-req="${d.request_id}">اعتماد وإرسال للعميل ←</button>
          <button class="btn btn-danger btn-sm" data-reject-draft="${d.id}">رفض وإرجاع</button>
        </div>
        <div id="reject-form-${d.id}" style="display:none;margin-top:.6rem">
          <textarea id="reject-notes-${d.id}" placeholder="سبب الرفض / ملاحظاتك للموظف..."></textarea>
          <button class="btn btn-o btn-sm" style="margin-top:.5rem" data-send-reject="${d.id}">إرسال الرفض ←</button>
        </div>
      `;
      draftEl.appendChild(card);
    });
    draftEl.querySelectorAll('[data-approve-draft]').forEach(btn => btn.addEventListener('click', async () => {
      await sb.from('drafts').update({ status: 'approved_for_client' }).eq('id', btn.dataset.approveDraft);
      await sb.from('requests').update({ status: 'pending_client_approval' }).eq('id', btn.dataset.req);
      renderAdmin();
    }));
    draftEl.querySelectorAll('[data-reject-draft]').forEach(btn => btn.addEventListener('click', () => {
      document.getElementById(`reject-form-${btn.dataset.rejectDraft}`).style.display = 'block';
    }));
    draftEl.querySelectorAll('[data-send-reject]').forEach(btn => btn.addEventListener('click', async () => {
      const notes = document.getElementById(`reject-notes-${btn.dataset.sendReject}`).value.trim();
      await sb.from('drafts').update({ status: 'rejected_by_admin', admin_notes: notes }).eq('id', btn.dataset.sendReject);
      renderAdmin();
    }));
  }

  const allReqEl = document.getElementById('allRequests');
  if (!requests || requests.length === 0) { allReqEl.innerHTML = `<div class="empty">لا توجد طلبات بعد.</div>`; return; }

  requests.forEach(r => {
    const card = document.createElement('div');
    card.className = 'card';
    const needsAssignment = !r.assigned_staff_id;
    card.innerHTML = `
      <div class="req-row">
        <div>
          <div class="req-title">${r.title}</div>
          <div class="req-meta">${r.services?.name_ar||''} · ${r.profiles?.company_name || r.profiles?.full_name || ''} · ${fmtDate(r.created_at)}</div>
        </div>
        ${statusBadge(r.status)}
      </div>
      ${needsAssignment ? `
        <div style="margin-top:.7rem;display:flex;gap:.5rem;align-items:center">
          <select id="assign-${r.id}" style="max-width:220px">
            <option value="">إسناد إلى...</option>
            ${(staffList||[]).map(s=>`<option value="${s.id}">${s.full_name}</option>`).join('')}
          </select>
          <button class="btn btn-g btn-sm" data-assign-btn="${r.id}">إسناد ←</button>
        </div>
      ` : ''}
    `;
    allReqEl.appendChild(card);
  });
  allReqEl.querySelectorAll('[data-assign-btn]').forEach(btn => btn.addEventListener('click', async () => {
    const reqId = btn.dataset.assignBtn;
    const staffId = document.getElementById(`assign-${reqId}`).value;
    if (!staffId) return;
    await sb.from('requests').update({ assigned_staff_id: staffId, status: 'assigned' }).eq('id', reqId);
    renderAdmin();
  }));
}

init();
</script>
</body>
</html>
